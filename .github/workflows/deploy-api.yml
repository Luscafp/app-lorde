name: Deploy da API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI verde
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Aguardar a CI do commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/aguardar-ci.sh "$GITHUB_SHA"

  # Concorrência por job: um deploy de produção esperando aprovação não segura a homologação.
  homologacao:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-api-homologacao
      cancel-in-progress: false
    environment:
      name: homologacao
      url: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/deploy-railway
        with:
          ambiente: homologacao
          token-railway: ${{ secrets.RAILWAY_TOKEN_HML }}
          url-api: ${{ vars.API_URL }}

  producao:
    needs: homologacao
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-api-producao
      cancel-in-progress: false
    environment:
      name: producao
      url: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/deploy-railway
        with:
          ambiente: producao
          token-railway: ${{ secrets.RAILWAY_TOKEN_PROD }}
          url-api: ${{ vars.API_URL }}
